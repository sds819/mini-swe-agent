    pattern: ^(?!(?:cat|head|tail|less|more|grep|egrep|fgrep|rg|wc|ls|stat|file|diff|nl)\b|python[0-9.]*\s+[\"']?(?:[^\s'\"]*/)?pricing\.py\b).*['\"](?:[^\s'\"]*/)?pricing\.py['\"]
