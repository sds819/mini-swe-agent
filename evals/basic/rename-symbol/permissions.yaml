permissions:
  mode: default
  rules:
    - tool: write
      pattern: pricing.py
      decision: deny
      reason: pricing.py is changed with the edit tool, not rewritten
    - tool: multi_edit
      pattern: pricing.py
      decision: deny
      reason: pricing.py is changed with the edit tool, not rewritten
    - tool: bash
      pattern: "^.*>\\s*(?:[^\\s'\"]*/)?pricing\\.py(?:$|[\\s'\";|&])"
      decision: deny
      reason: pricing.py is changed with the edit tool, not written by a shell command
    - tool: bash
      pattern: "^(?:.*[\\s'\"])?(?:sed\\s+-i|cp|mv|tee|install|truncate|ln)\\b.*[\\s'\"](?:[^\\s'\"]*/)?pricing\\.py(?:$|[\\s'\";|&])"
      decision: deny
      reason: pricing.py is changed with the edit tool, not written by a shell command
