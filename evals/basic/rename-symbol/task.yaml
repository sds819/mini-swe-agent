id: rename-symbol
prompt: |
  The pricing module calls the sum of the prices `total_price`, but the test calls
  it `grand_total`. Rename the function to `grand_total` in the module and in every
  caller, so that the test passes. Change the files in place: they may not be
  rewritten from scratch.
verify:
  - python -c 'import pricing; assert pricing.grand_total([2,3])==5'
  - "python -c 'import report; print(report.render([2,3]))' | grep -qx \"Total: 5\""
require_tools:
  - tools: [edit, multi_edit]
    paths: [pricing.py, report.py]
config:
  - permissions.yaml
tags: [refactor]
