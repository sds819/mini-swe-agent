permissions:
  mode: default
  rules:
  - tool: write
    pattern: greet.py
    decision: deny
    reason: greet.py is changed with the edit tool, not rewritten
  - tool: multi_edit
    pattern: greet.py
    decision: deny
    reason: greet.py is changed with the edit tool, not rewritten
  - tool: bash
    pattern: ^.*>\s*[\"']?(?:[^\s'\"]*/)?greet\.py(?:$|[\s'\";|&])
    decision: deny
    reason: greet.py is changed with the edit tool, not written by a shell command
  - tool: bash
    pattern: ^(?:.*[\s'\"])?(?:sed\s+-i|cp|mv|tee|install|truncate|ln|patch)\b.*[\s'\"](?:[^\s'\"]*/)?greet\.py(?:$|[\s'\";|&])
    decision: deny
    reason: greet.py is changed with the edit tool, not written by a shell command
  - tool: bash
    pattern: ^(?!(?:cat|head|tail|less|more|grep|egrep|fgrep|rg|wc|ls|stat|file|diff|nl)\b|python[0-9.]*\s+[\"']?(?:[^\s'\"]*/)?greet\.py\b).*['\"](?:[^\s'\"]*/)?greet\.py['\"]
    decision: deny
    reason: greet.py is changed with the edit tool, not written by a shell command
