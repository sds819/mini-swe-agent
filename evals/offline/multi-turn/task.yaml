id: multi-turn
prompts:
  - |
    Read calc.py and tell me what `add_one` does.
  - |
    Now fix it so that the test passes.
  - |
    Run the test and tell me the result.
verify:
  - python -m pytest -q tests/test_calc.py
require_tools:
  - tools: [edit, multi_edit]
    paths: [calc.py]
tags: [offline]
script:
  - content: Let me look at the file.
    tool_calls:
      - tool: read
        args: {path: calc.py}
  - content: add_one returns n + 2, one too much.
  - content: Now I fix the addition.
    tool_calls:
      - tool: edit
        args:
          path: calc.py
          old_string: "return n + 2"
          new_string: "return n + 1"
  - content: The function adds one now.
  - content: Let me run the test.
    tool_calls:
      - tool: bash
        args:
          command: python -m pytest -q tests/test_calc.py
  - content: The test passes.
