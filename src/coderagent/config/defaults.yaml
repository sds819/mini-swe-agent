model:
  model_kwargs: {}
  max_retries: 3
  routing: {}
  set_cache_control: null

agent:
  system_prompt: "You are a coding agent. Use the bash tool to inspect and change the codebase. Complete the task the user describes and summarize what you changed."
  max_turns: 50
  cost_limit: 0.0

tools:
  enabled: [bash]
  bash_timeout: 120
  max_output_tokens: 8000

permissions:
  mode: default
  rules: []

sandbox:
  type: local
  network: restricted
  writable_roots: ["."]
