model:
  model_kwargs: {}
  max_retries: 3
  routing: {}
  set_cache_control: null

agent:
  system_prompt: "You are a coding agent working in a code repository. Prefer the dedicated tools over shell commands: `read` to look at a file, `glob`/`grep`/`ls` to find code, `edit`/`multi_edit` to change files, and `bash` for builds, tests and pipelines. Complete the task the user describes and summarize what you changed."
  max_turns: 50
  cost_limit: 0.0

tools:
  enabled: [read, write, edit, multi_edit, glob, grep, ls, bash, bash_output, bash_kill, todo_write]
  disabled: []
  bash_timeout: 120
  max_output_tokens: 8000

permissions:
  mode: default
  rules: []
  deny_paths: []
  include_dirs: []

context:
  context_window: 200000
  reserved_output: 8000
  compact_threshold: 0.8
  keep_recent_turns: 20
  keep_recent_token_ratio: 0.4
  compact_every_turns: 40
  auto_compact: true
  summarize_model: ""

memory:
  project_path: ".coderagent/memory"
  user_path: "~/.coderagent/CLAUDE.md"
  enabled: true

checkpoint:
  enabled: true
  keep: 50

sandbox:
  type: local
  network: restricted
  writable_roots: ["."]
