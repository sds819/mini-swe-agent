<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}coder{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">coder</a>
    <nav>
      <a href="/">Chat</a>
      <a href="/settings">Settings</a>
    </nav>
    <span class="spacer"></span>
    <select class="language" title="the language of the pages"
            onchange="location.href='/lang/' + this.value + '?next=' + encodeURIComponent({{ request.url.path | tojson }})">
      {% for option in languages %}
      <option value="{{ option.code }}"{% if option.code == language %} selected{% endif %}>{{ option.name }}</option>
      {% endfor %}
    </select>
    <span class="status" id="status">no session</span>
  </header>
  {% block content %}{% endblock %}
  <script>window.STRINGS = {{ strings | tojson }};</script>
  <script src="/static/app.js"></script>
</body>
</html>
